<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMT Agro — Cattle Price Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #2B3674;
    --green: #2D6A2D;
    --gold: #C8A94A;
    --bg: #F5F7F2;
    --card: #ffffff;
    --border: #e2e8df;
    --text: #1a2340;
    --muted: #6b7a6b;
    --asking: #2D6A2D;
    --selling: #2B3674;
    --final: #C8A94A;
    --radius: 12px;
  }

  body {
    font-family: 'Hind Siliguri', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
  }

  header {
    background: var(--navy);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 12px rgba(43,54,116,0.18);
  }

  header img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    filter: brightness(0) invert(1);
    border-radius: 8px;
  }

  .header-text h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 1px;
  }

  .header-text p {
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    margin-top: 1px;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .search-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .search-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }

  .search-row {
    display: flex;
    gap: 8px;
  }

  .search-row input {
    flex: 1;
    height: 44px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    font-size: 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 500;
    letter-spacing: 1px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
    text-transform: uppercase;
  }

  .search-row input:focus { border-color: var(--navy); }
  .search-row input::placeholder { font-family: 'Hind Siliguri', sans-serif; text-transform: none; letter-spacing: 0; font-size: 14px; color: #aaa; font-weight: 400; }

  .search-row button {
    height: 44px;
    padding: 0 18px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Hind Siliguri', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex; align-items: center; gap: 6px;
  }

  .search-row button:hover { background: #1e285a; }
  .search-row button:active { transform: scale(0.97); }

  .quick-tags {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .quick-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }

  .quick-btn {
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--navy);
    font-size: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }

  .quick-btn:hover { background: var(--navy); color: #fff; border-color: var(--navy); }

  .result-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    background: linear-gradient(135deg, var(--navy) 0%, #3d4f9f 100%);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .tag-pill {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 4px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }

  .step-dots {
    display: flex;
    gap: 5px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
  }

  .dot.active { background: var(--gold); }

  .info-list { padding: 4px 0; }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
  }

  .info-row:last-child { border-bottom: none; }

  .info-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }

  .info-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.3px;
  }

  .info-value.asking { color: var(--asking); font-size: 20px; }
  .info-value.selling { color: var(--selling); font-size: 18px; }
  .info-value.final { color: #9a7a1a; font-size: 18px; }
  .info-value.purchase { color: #c0392b; font-size: 15px; }

  .more-btn {
    width: 100%;
    padding: 14px;
    background: var(--bg);
    border: none;
    border-top: 1px solid var(--border);
    color: var(--navy);
    font-size: 14px;
    font-family: 'Hind Siliguri', sans-serif;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s;
  }

  .more-btn:hover { background: #eef1f7; }

  .chevron { font-size: 16px; transition: transform 0.2s; }

  .not-found {
    text-align: center;
    padding: 32px 16px;
    color: var(--muted);
  }

  .not-found .icon { font-size: 40px; margin-bottom: 8px; }
  .not-found p { font-size: 14px; }

  footer {
    text-align: center;
    padding: 16px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 32px;
  }
</style>
</head>
<body>

<header>
  <img id="logoImg" alt="LMT Agro Logo">
  <div class="header-text">
    <h1>LMT AGRO</h1>
    <p>Cattle Price Lookup System</p>
  </div>
</header>

<div class="container">

  <div class="search-card">
    <div class="search-label">Tag Number দিয়ে খুঁজুন</div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="যেমন: Q-102, Q-153" oninput="clearIfEmpty()" onkeydown="if(event.key==='Enter')doSearch()" />
      <button onclick="doSearch()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        খুঁজুন
      </button>
    </div>
    <div class="quick-tags">
      <span class="quick-label">দ্রুত:</span>
      <button class="quick-btn" onclick="quickSearch('Q-102')">Q-102</button>
      <button class="quick-btn" onclick="quickSearch('Q-125')">Q-125</button>
      <button class="quick-btn" onclick="quickSearch('Q-132')">Q-132</button>
      <button class="quick-btn" onclick="quickSearch('Q-150')">Q-150</button>
      <button class="quick-btn" onclick="quickSearch('Q-153')">Q-153</button>
    </div>
  </div>

  <div id="result"></div>

</div>

<footer>LMT Agro Farm — Cattle Management System</footer>

const fmt = n => '৳' + n.toLocaleString('en-IN');
const steps = {};

function quickSearch(tag) {
  document.getElementById('searchInput').value = tag;
  doSearch();
}

function clearIfEmpty() {
  if (!document.getElementById('searchInput').value.trim()) {
    document.getElementById('result').innerHTML = '';
  }
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toUpperCase();
  const item = cattle.find(c => c.tag === q);
  const el = document.getElementById('result');
  if (!item) {
    el.innerHTML = '<div class="not-found"><div class="icon">🔍</div><p>কোনো তথ্য পাওয়া যায়নি।<br><small>Tag number সঠিক কিনা দেখুন।</small></p></div>';
    return;
  }
  steps[item.tag] = 1;
  renderCard(item);
}

function renderCard(item) {
  const step = steps[item.tag] || 1;
  const el = document.getElementById('result');

  const dots = [1,2,3].map(i => `<div class="dot ${step>=i?'active':''}"></div>`).join('');

  let rows = '';
  if (step === 1) {
    rows = `
      <div class="info-row"><span class="info-label">Tag Number</span><span class="info-value">${item.tag}</span></div>
      <div class="info-row"><span class="info-label">Asking Price</span><span class="info-value asking">${fmt(item.asking)}</span></div>
    `;
  } else if (step === 2) {
    rows = `
      <div class="info-row"><span class="info-label">Tag Number</span><span class="info-value">${item.tag}</span></div>
      <div class="info-row"><span class="info-label">Live Weight</span><span class="info-value">${item.live}</span></div>
      <div class="info-row"><span class="info-label">Asking Price</span><span class="info-value asking">${fmt(item.asking)}</span></div>
      <div class="info-row"><span class="info-label">Selling Price</span><span class="info-value selling">${fmt(item.selling)}</span></div>
    `;
  } else {
    rows = `
      <div class="info-row"><span class="info-label">Tag Number</span><span class="info-value">${item.tag}</span></div>
      <div class="info-row"><span class="info-label">Live Weight</span><span class="info-value">${item.live}</span></div>
      <div class="info-row"><span class="info-label">Meat Weight</span><span class="info-value">${item.meat} মণ</span></div>
      <div class="info-row"><span class="info-label">Purchase Price</span><span class="info-value purchase">${fmt(item.purchase)}</span></div>
      <div class="info-row"><span class="info-label">Asking Price</span><span class="info-value asking">${fmt(item.asking)}</span></div>
      <div class="info-row"><span class="info-label">Selling Price</span><span class="info-value selling">${fmt(item.selling)}</span></div>
      <div class="info-row"><span class="info-label">Final Price</span><span class="info-value final">${fmt(item.final)}</span></div>
    `;
  }

  const moreBtn = step < 3 ? `<button class="more-btn" onclick="nextStep('${item.tag}')">আরও দেখুন <span class="chevron">▼</span></button>` : '';

  el.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <span class="tag-pill">${item.tag}</span>
        <div class="step-dots">${dots}</div>
      </div>
      <div class="info-list">${rows}</div>
      ${moreBtn}
    </div>
  `;
}

function nextStep(tag) {
  const item = cattle.find(c => c.tag === tag);
  steps[tag] = (steps[tag] || 1) + 1;
  renderCard(item);
}
